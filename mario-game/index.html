<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍄 Super Kiro Bros</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HUD (placar) -->
  <div id="hud">
    <span>🍄 VIDAS: <span id="lives">3</span></span>
    <span>⭐ PONTOS: <span id="score">0</span></span>
    <span>🏆 FASE: <span id="level">1</span></span>
  </div>

  <!-- Canvas do jogo -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- Overlay: menu inicial / game over / vitória -->
  <div id="overlay">
    <h1>🍄 Super Kiro Bros</h1>
    <p>← → Mover &nbsp;|&nbsp; ↑ ou ESPAÇO Pular<br>Colete moedas, desvie dos inimigos!</p>
    <button id="startBtn">▶ INICIAR</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
